[project]
name = "ashes-2027"
version = "0.1.0"
description = "A Bayesian forecast of the 2027 men's Ashes series"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "matplotlib>=3.11.2",
    "pymc>=5.28.5",
]

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cricket"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["F811"]   # pytest fixtures imported from another test file look like redefinitions
